<div class="dashboard-shell">
  <aside class="sidebar" aria-label="Primary navigation">
    <a
      class="brand"
      href="#dashboard-home"
      aria-label="Go to dashboard home"
      (click)="setActiveSection('dashboard')"
    >
      <span class="brand-mark" aria-hidden="true">
        <img src="/icon.jpg" alt="" />
      </span>
      <span>
        <strong>StravaXport</strong>
        <small>The Social Runner</small>
      </span>
    </a>

    <nav class="nav-list" aria-label="Dashboard sections">
      @for (item of sidebarItems; track item.section) {
        <a
          class="nav-link"
          [class.active-link]="activeSection() === item.section"
          [href]="item.href"
          [attr.aria-current]="activeSection() === item.section ? 'page' : null"
          (click)="setActiveSection(item.section)"
        >
          @switch (item.section) {
            @case ('dashboard') {
              <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <rect width="7" height="9" x="3" y="3" rx="1" />
                <rect width="7" height="5" x="14" y="3" rx="1" />
                <rect width="7" height="9" x="14" y="12" rx="1" />
                <rect width="7" height="5" x="3" y="16" rx="1" />
              </svg>
            }
            @case ('calendar') {
              <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M8 2v4" />
                <path d="M16 2v4" />
                <rect width="18" height="18" x="3" y="4" rx="2" />
                <path d="M3 10h18" />
                <path d="M17 14h-6" />
                <path d="M13 18H7" />
                <path d="M7 14h.01" />
                <path d="M17 18h.01" />
              </svg>
            }
          }
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <main class="dashboard-main" id="dashboard-home">
    <header class="hero-header">
      <div>
        <p class="product-lockup">
          <span>StravaXport</span>
          <small>The Social Runner</small>
        </p>
        <p class="welcome-line">
          Hello, {{ userProfile().displayName }}!
        </p>
      </div>

      <div class="header-actions">
        <span class="connection-pill">
          <span class="status-dot" aria-hidden="true"></span>
          {{ userProfile().connectionLabel }}
        </span>
        <button class="avatar-button" type="button" aria-label="Leave dashboard preview" (click)="logout()">
          <img
            [ngSrc]="userProfile().avatarUrl"
            width="54"
            height="54"
            alt=""
            priority
          />
        </button>
      </div>
    </header>

    <section
      id="calendar-section"
      class="calendar-feature-row"
      aria-label="Calendar date range"
      (mouseenter)="setActiveSection('calendar')"
      (focusin)="setActiveSection('calendar')"
    >
      <app-calendar [range]="selectedRange()" (rangeChange)="updateDateRange($event)" />
    </section>
  </main>
</div>
