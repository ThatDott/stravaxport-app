<section class="average-stats-grid" aria-label="Average stats for selected date range">
  <app-average-distance [activity]="activity()" [distanceKm]="stats().averageDistanceKm" />
  <app-average-time
    [activity]="activity()"
    [minutes]="stats().averageTimeMinutes"
    [activityCount]="stats().activityCount"
  />
  <app-average-elevation
    [activity]="activity()"
    [elevationM]="stats().totalElevationM"
    [equivalentPercent]="stats().elevationEquivalentPercent"
  />
</section>
