<section class="insights-card" aria-labelledby="ai-insights-title">
  <header class="card-header">
    <div class="title-row">
      <span class="title-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M9.8 4.2 8.6 7.4a2 2 0 0 1-1.2 1.2L4.2 9.8l3.2 1.2a2 2 0 0 1 1.2 1.2l1.2 3.2 1.2-3.2a2 2 0 0 1 1.2-1.2l3.2-1.2-3.2-1.2A2 2 0 0 1 11 7.4L9.8 4.2Z" />
          <path d="m17.5 14 .6 1.5a1 1 0 0 0 .6.6l1.5.6-1.5.6a1 1 0 0 0-.6.6l-.6 1.5-.6-1.5a1 1 0 0 0-.6-.6l-1.5-.6 1.5-.6a1 1 0 0 0 .6-.6l.6-1.5Z" />
        </svg>
      </span>
      <div>
        <h2 id="ai-insights-title">AI Insights</h2>
        <small>Tailored to your selected range</small>
      </div>
    </div>
  </header>

  <div class="insight-body" aria-live="polite">
    @if (primaryInsight(); as insight) {
      <p class="range-note">{{ rangeLabel() }}</p>
      <p class="insight-title">{{ insight.title }}</p>
      @if (guidance(); as aiGuide) {
        <p class="insight-guidance">{{ aiGuide }}</p>
      }
    } @else {
      <small class="empty-state">Not enough activities yet. Log some miles and check back for your personalised insights!</small>
    }
  </div>
</section>
